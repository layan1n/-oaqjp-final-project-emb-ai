
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
</head>
<body>
    <h1>Emotion Detector</h1>
    <p>Enter text to analyze your emotions.</p>

    <textarea id="textToAnalyze" rows="5" cols="50"></textarea>
    <br>
    <button onclick="analyzeEmotion()">Analyze Emotion</button>

    <h2>Result</h2>
    <div id="result"></div>

    <script>
        async function analyzeEmotion() {
            const text = document.getElementById("textToAnalyze").value;
            const response = await fetch(
                "/emotionDetector?textToAnalyze=" + encodeURIComponent(text)
            );
            document.getElementById("result").textContent =
                await response.text();
        }
    </script>
</body>
</html>
